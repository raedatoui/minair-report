[project]
name = "minair-analysis"
version = "0.1.0"
description = "Analyze Minair sensor CSV exports and generate offline and all-time reports."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "duckdb>=1.4,<3",
]

[dependency-groups]
dev = [
    "ruff>=0.14,<1",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
